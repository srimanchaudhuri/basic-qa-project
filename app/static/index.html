<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website QA — Analyze any site</title>
    <meta name="description" content="Enter a URL, get an instant AI summary, and ask questions about any website.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0a0a12;
            --bg-card: rgba(255, 255, 255, 0.025);
            --bg-card-alt: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.06);
            --border-focus: rgba(129, 140, 248, 0.5);
            --text: #e2e8f0;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #818cf8;
            --accent-dim: rgba(129, 140, 248, 0.12);
            --gradient: linear-gradient(135deg, #6366f1, #8b5cf6);
            --radius: 12px;
            --radius-sm: 8px;
            --ease: cubic-bezier(0.4, 0, 0.2, 1);
        }

        html {
            height: 100%;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            -webkit-font-smoothing: antialiased;
        }

        /* ========== Background glow ========== */
        body::before {
            content: '';
            position: fixed;
            top: -40%;
            left: 50%;
            width: 800px;
            height: 800px;
            transform: translateX(-50%);
            background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        /* ========== Layout ========== */
        .container {
            width: 100%;
            max-width: 740px;
            margin: 0 auto;
            padding: 0 24px;
            position: relative;
            z-index: 1;
        }

        /* ========== Input Phase ========== */
        #input-phase {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 32px 24px;
            transition: opacity 0.4s var(--ease), transform 0.4s var(--ease);
        }

        #input-phase.hidden {
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
            position: absolute;
            height: 0;
            overflow: hidden;
        }

        .logo {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 20px;
        }

        h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 700;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #fff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            text-align: center;
            margin-bottom: 40px;
            line-height: 1.6;
        }

        .input-card {
            width: 100%;
            max-width: 560px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            backdrop-filter: blur(20px);
        }

        .url-row {
            display: flex;
            gap: 10px;
        }

        .url-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .url-input::placeholder {
            color: var(--text-muted);
        }

        .url-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
        }

        .page-limit-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        .page-limit-row label {
            font-size: 12px;
            color: var(--text-muted);
            white-space: nowrap;
        }

        .page-limit-input {
            width: 64px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 10px;
            color: var(--text);
            font-family: inherit;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s var(--ease);
        }

        .page-limit-input:focus {
            border-color: var(--border-focus);
        }

        .btn-primary {
            background: var(--gradient);
            color: #fff;
            border: none;
            border-radius: var(--radius-sm);
            padding: 12px 24px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s, transform 0.1s;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .btn-primary:active {
            transform: scale(0.97);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* ========== Results Phase ========== */
        #results-phase {
            display: none;
            flex-direction: column;
            min-height: 100vh;
            animation: fadeIn 0.5s var(--ease);
        }

        #results-phase.visible {
            display: flex;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .top-bar {
            padding: 20px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }

        .analyzed-url {
            font-size: 13px;
            color: var(--text-secondary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 500px;
        }

        .analyzed-url span {
            color: var(--accent);
            font-weight: 500;
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 8px 16px;
            color: var(--text-secondary);
            font-family: inherit;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .btn-ghost:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        /* Summary */
        .summary-section {
            padding: 28px 0;
        }

        .section-label {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
        }

        .summary-text {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 20px 24px;
            font-size: 14px;
            line-height: 1.8;
            color: var(--text-secondary);
        }

        .crawl-stats {
            display: flex;
            gap: 20px;
            margin-top: 14px;
        }

        .stat {
            font-size: 11px;
            color: var(--text-muted);
        }

        .stat strong {
            color: var(--text-secondary);
            font-weight: 500;
        }

        /* Chat */
        .chat-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-bottom: 24px;
        }

        .chat-section .section-label {
            padding-top: 8px;
            border-top: 1px solid var(--border);
        }

        .messages {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
            padding: 16px 0;
            min-height: 120px;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: msgIn 0.35s var(--ease);
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg-role {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .msg-role.user {
            color: var(--accent);
        }

        .msg-role.ai {
            color: #a78bfa;
        }

        .msg-content {
            font-size: 14px;
            line-height: 1.7;
            color: var(--text-secondary);
        }

        .msg-content.user-content {
            color: var(--text);
            font-weight: 500;
        }

        .msg-sources {
            margin-top: 6px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: var(--radius-sm);
            border: 1px solid var(--border);
        }

        .msg-sources summary {
            font-size: 11px;
            color: var(--text-muted);
            cursor: pointer;
            user-select: none;
        }

        .msg-sources .source-item {
            margin-top: 8px;
            font-size: 12px;
            color: var(--text-muted);
            line-height: 1.5;
            padding-left: 10px;
            border-left: 2px solid var(--border);
        }

        .msg-sources .source-url {
            font-size: 11px;
            color: var(--accent);
            opacity: 0.7;
        }

        /* Chat input */
        .chat-input-bar {
            display: flex;
            gap: 10px;
            position: sticky;
            bottom: 24px;
            background: var(--bg);
            padding: 12px 0;
        }

        .chat-input {
            flex: 1;
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-input:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
        }

        .btn-send {
            background: var(--bg-card-alt);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 12px 20px;
            color: var(--accent);
            font-family: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s var(--ease);
        }

        .btn-send:hover {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .btn-send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* Loading */
        .loading-dots::after {
            content: '';
            animation: dots 1.4s infinite;
        }

        @keyframes dots {

            0%,
            20% {
                content: '';
            }

            40% {
                content: '.';
            }

            60% {
                content: '..';
            }

            80%,
            100% {
                content: '...';
            }
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 8px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: typingBounce 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingBounce {

            0%,
            80%,
            100% {
                transform: translateY(0);
                opacity: 0.4;
            }

            40% {
                transform: translateY(-6px);
                opacity: 1;
            }
        }

        /* Status toast */
        .status-bar {
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 16px;
            min-height: 20px;
        }

        .error-text {
            color: #f87171;
        }

        /* Responsive */
        @media (max-width: 520px) {
            .url-row {
                flex-direction: column;
            }

            .input-card {
                padding: 18px;
            }

            .top-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .analyzed-url {
                max-width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ========== INPUT PHASE ========== -->
    <div id="input-phase">
        <div class="logo">Website QA</div>
        <h1>Analyze any website</h1>
        <p class="subtitle">Enter a URL to crawl, get an AI-generated summary,<br>and ask questions about its content.
        </p>

        <div class="input-card">
            <div class="url-row">
                <input id="url-input" class="url-input" type="url" placeholder="https://example.com" required autofocus>
                <button id="analyze-btn" class="btn-primary" onclick="handleAnalyze()">
                    Analyze
                </button>
            </div>
            <div class="page-limit-row">
                <label for="page-limit">Pages to crawl:</label>
                <input id="page-limit" class="page-limit-input" type="number" value="10" min="1" max="500">
            </div>
            <div id="status-bar" class="status-bar"></div>
        </div>
    </div>

    <!-- ========== RESULTS PHASE ========== -->
    <div id="results-phase">
        <div class="container">
            <div class="top-bar">
                <div class="analyzed-url">
                    Analyzing <span id="display-url"></span>
                </div>
                <button class="btn-ghost" onclick="resetToInput()">+ New URL</button>
            </div>

            <div class="summary-section">
                <div class="section-label">Summary</div>
                <div id="summary-text" class="summary-text"></div>
                <div id="crawl-stats" class="crawl-stats"></div>
            </div>

            <div class="chat-section">
                <div class="section-label">Ask Questions</div>
                <div id="messages" class="messages"></div>

                <div class="chat-input-bar">
                    <input id="chat-input" class="chat-input" type="text"
                        placeholder="Ask a question about this website..."
                        onkeydown="if(event.key==='Enter') handleAsk()">
                    <button id="ask-btn" class="btn-send" onclick="handleAsk()">Ask</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const $ = (id) => document.getElementById(id);

        // ——— Analyze ———
        async function handleAnalyze() {
            const url = $('url-input').value.trim();
            if (!url) return;

            const pageLimit = parseInt($('page-limit').value) || 10;
            const btn = $('analyze-btn');
            const status = $('status-bar');

            btn.disabled = true;
            btn.innerHTML = 'Crawling<span class="loading-dots"></span>';
            status.textContent = '';

            try {
                // Step 1: clear old data
                status.textContent = 'Clearing previous data…';
                await fetch('/documents/collection', { method: 'DELETE' }).catch(() => { });

                // Step 2: crawl
                status.textContent = 'Crawling website…';
                const crawlRes = await fetch('/documents/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, page_limit: pageLimit }),
                });

                if (!crawlRes.ok) {
                    const err = await crawlRes.json().catch(() => ({}));
                    throw new Error(err.detail || 'Crawl failed');
                }

                const crawlData = await crawlRes.json();

                // Step 3: generate summary
                btn.innerHTML = 'Summarizing<span class="loading-dots"></span>';
                status.textContent = `Crawled ${crawlData.pages_crawled} pages. Generating summary…`;

                const queryRes = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: 'Provide a concise summary of the main content, topics, and purpose of this website.',
                        include_sources: false,
                        enable_evaluation: false,
                    }),
                });

                if (!queryRes.ok) throw new Error('Summary generation failed');

                const queryData = await queryRes.json();

                // Show results
                showResults(url, crawlData, queryData.answer);

            } catch (e) {
                status.innerHTML = `<span class="error-text">${e.message}</span>`;
                btn.disabled = false;
                btn.textContent = 'Analyze';
            }
        }

        function showResults(url, crawlData, summary) {
            $('input-phase').classList.add('hidden');

            $('display-url').textContent = url;
            $('summary-text').textContent = summary;
            $('crawl-stats').innerHTML = `
                <span class="stat"><strong>${crawlData.pages_crawled}</strong> pages</span>
                <span class="stat"><strong>${crawlData.chunks_created}</strong> chunks</span>
            `;

            $('messages').innerHTML = '';
            $('results-phase').classList.add('visible');

            setTimeout(() => $('chat-input').focus(), 400);
        }

        // ——— Ask Questions ———
        async function handleAsk() {
            const input = $('chat-input');
            const question = input.value.trim();
            if (!question) return;

            input.value = '';
            const askBtn = $('ask-btn');
            askBtn.disabled = true;

            addMessage('you', question);
            const loadingEl = addTypingIndicator();

            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question,
                        include_sources: true,
                        enable_evaluation: false,
                    }),
                });

                loadingEl.remove();

                if (!res.ok) throw new Error('Query failed');

                const data = await res.json();
                addMessage('ai', data.answer, data.sources);

            } catch (e) {
                loadingEl.remove();
                addMessage('ai', `Error: ${e.message}`);
            } finally {
                askBtn.disabled = false;
                input.focus();
            }
        }

        function addMessage(role, content, sources) {
            const msgs = $('messages');
            const div = document.createElement('div');
            div.className = 'message';

            let html = `
                <div class="msg-role ${role}">${role === 'you' ? 'You' : 'AI'}</div>
                <div class="msg-content ${role === 'you' ? 'user-content' : ''}">${escapeHtml(content)}</div>
            `;

            if (sources && sources.length > 0) {
                html += `<details class="msg-sources"><summary>${sources.length} source${sources.length > 1 ? 's' : ''} used</summary>`;
                for (const s of sources) {
                    const srcUrl = s.metadata?.source || '';
                    html += `
                        <div class="source-item">
                            ${escapeHtml(s.content.substring(0, 200))}${s.content.length > 200 ? '…' : ''}
                            ${srcUrl ? `<div class="source-url">${escapeHtml(srcUrl)}</div>` : ''}
                        </div>
                    `;
                }
                html += '</details>';
            }

            div.innerHTML = html;
            msgs.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth', block: 'end' });
        }

        function addTypingIndicator() {
            const msgs = $('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `
                <div class="msg-role ai">AI</div>
                <div class="typing-indicator"><span></span><span></span><span></span></div>
            `;
            msgs.appendChild(div);
            div.scrollIntoView({ behavior: 'smooth', block: 'end' });
            return div;
        }

        // ——— Reset ———
        function resetToInput() {
            $('results-phase').classList.remove('visible');
            $('input-phase').classList.remove('hidden');

            const btn = $('analyze-btn');
            btn.disabled = false;
            btn.textContent = 'Analyze';
            $('status-bar').textContent = '';
            $('url-input').value = '';
            setTimeout(() => $('url-input').focus(), 400);
        }

        function escapeHtml(text) {
            const el = document.createElement('span');
            el.textContent = text;
            return el.innerHTML;
        }

        // Enter key on URL input
        $('url-input').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleAnalyze();
        });
    </script>
</body>

</html>
