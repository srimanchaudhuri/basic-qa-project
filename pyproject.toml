[project]
name = "basic-qa-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "langchain",
    "langchain-ollama",
    "langchain-community<0.4.2",
    "langchain-qdrant",
    "langchain-text-splitters",
    "qdrant-client",
    "langchain-docling[local]",
    "structlog",
    "langsmith>=0.12.2",
    "unstructured>=0.27.5",
    "ragas>=0.4.3",
    "asyncio>=4.0.0",
    "fastembed>=0.8.0",
    "docling-parse>=7.18.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "web-crawler",
]

[tool.uv.sources]
web-crawler = { path = "../web-crawler" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
